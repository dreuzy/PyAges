# Historical article-reproduction baseline. This is distinct from the
# qualified user constraints in constraints.txt.
name: pyages-article-reproduction
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip=26.2.1
  - numpy=2.1.2
  - scipy=1.14.1
  - pandas=2.2.3
  - openpyxl=3.1.5
  - matplotlib=3.10.8
  - pyyaml=6.0.3
  - click=8.4.2
  - pydantic=2.13.4
  - ipython=9.16.1
  - jupyterlab=4.6.3
