# Coverage matrix from the official USGS TracerLPM Example 1 workbook.
# The models are those documented in USGS Techniques and Methods 4-F3.
# Only the first case currently has a repeated, qualified baseline.

- case_id: example1-pfm-emm
# Exact value from the Excel list; includes the sampling date.
  sample: PSW-1-17/08/2004
# Models and axes are selected by label, without hard-coded indices.
  model1: PFM
  model2: EMM
  x_axis: 3H/3Ho
  y_axis: SF6
# Repeated technical baselines demonstrate stability, not domain validity.
  expected_model1_sha256: 2E14DA49ACB873C833A0FDFEBD23C26D6483498A7643C7B3DB3A90AB93946FB8
  expected_model2_sha256: 2834E84BFD505DEA2E0CC04EBC7A72FF1C756D50AC5ED14B2D10A7E8E71EECC3

# Coverage case for the two continuous two-parameter models.
- case_id: example1-epm-pem
  sample: PSW-1-17/08/2004
  model1: EPM
  model2: PEM
  x_axis: 3H/3Ho
  y_axis: SF6
# No expected hash: the status indicates only a successful run.

# Coverage case for the dispersion model and a binary mixture.
- case_id: example1-dm-binary-mix
  sample: PSW-1-17/08/2004
  model1: DM
  model2: BMM-PFM-EMM
  x_axis: 3H/3Ho
  y_axis: SF6
# No expected hash until repeatability has been qualified.
