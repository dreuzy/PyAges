# Provisional tolerances reserved for the analytical invariants of Phase 1.
# PyAges-TracerLPM tolerances will be set only after convergence.
analytic:
  absolute: 1.0e-10
  relative: 1.0e-9

# Floor used later in the symmetric relative difference.
comparison:
  symmetric_relative_floor: 1.0e-12
# Intentionally null values: they will be determined in Phase 5.
  tracerlpm_absolute: null
  tracerlpm_relative: null
