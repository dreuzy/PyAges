# Les tolérances PyAges–TracerLPM seront fixées seulement après convergence.
analytic:
  absolute: 1.0e-10
  relative: 1.0e-9

# Plancher utilisé plus tard dans la différence relative symétrique.
comparison:
  symmetric_relative_floor: 1.0e-12
  # Valeurs volontairement nulles : elles seront déterminées en Phase 5.
  tracerlpm_absolute: null
  tracerlpm_relative: null
