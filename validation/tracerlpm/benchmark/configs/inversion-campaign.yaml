# Première campagne d’inversion : un seul paramètre, aucun bruit.
campaign_id: tracerlpm-inversion-pilot-v1
observation_year: 2020.0

# Les chemins sont relatifs à la racine du dépôt PyAges.
tracers:
  - name: cfc11
    recharge: data_core/data_tracer/cfc11/recharge.csv
    unit: pptv
  - name: cfc12
    recharge: data_core/data_tracer/cfc12/recharge.csv
    unit: pptv
  - name: cfc113
    recharge: data_core/data_tracer/cfc113/recharge.csv
    unit: pptv


# Les observations sont calculées par scripts/reference.py, sans appeler PyAges
# ni le XLL TracerLPM.
cases:
  - case_id: inversion-emm-tau20-no-noise
    model: EMM
    true_parameters:
      tau: 20.0
    bounds:
      tau: [0.1, 200.0]
    initial_values:
      tau: [5.0, 20.0, 80.0]
    noise:
      kind: none
  - case_id: inversion-epm-tau20-r2-no-noise
    model: EPM
    true_parameters:
      tau: 20.0
      eta: 3.0              # eta PyAges = 1 + ratio TracerLPM r
    bounds:
      tau: [0.1, 200.0]
      eta: [1.01, 11.0]     # équivaut à r dans [0.01, 10]
    initial_values:
      # Couples [tau, eta]; côté TracerLPM, r=eta-1.
      - [5.0, 1.5]
      - [20.0, 3.0]
      - [80.0, 10.0]
    noise:
      kind: none
  - case_id: inversion-dm-tau20-dp0_2-no-noise
    model: DM
    true_parameters: {tau: 20.0, DP: 0.2}
    bounds:
      tau: [0.1, 200.0]
      DP: [0.001, 3.0]
    initial_values:
      - [5.0, 0.02]
      - [20.0, 0.2]
      - [80.0, 1.0]
    noise: {kind: none}

# Échelle commune des résidus. Le plancher évite une division par zéro.
objective:
  relative_standard_deviation: 0.01
  absolute_floor_fraction_of_tracer_maximum: 0.000001

acceptance:
  maximum_tau_absolute_error_years: 0.5
  maximum_recalculated_relative_error: 0.01
  maximum_tau_relative_error: 0.05
  maximum_secondary_parameter_relative_error: 0.10
