# EPM matrix: TracerLPM accepts r=x*/x; PyAges uses eta=1+r.
# The three cases below therefore correspond to eta=1.5, 3, and 10.
- case_id: synthetic-multi-peak-epm-eta-1_5
  sample: PSW-1-17/08/2004
  observation_year: 2004.6256830601094
  tracerlpm_effective_observation_year: 2004.5
  model1: EPM
  model2: EPM
  model_parameter: 0.5  # ratio TracerLPM r; eta PyAges = 1.5
  x_axis: SF6
  y_axis: NO3-N
  input_history: &multi_peak_input
    path: ../inputs/synthetic/multi_peak.csv
    sha256: 84DCF2EED3EA98DEB1DF7BC052F82DC1DCB787C2692053125E8CB77879E5D993
    target_tracers: [SF6, NO3-N]
    before: 0.0
    after: hold_last

- case_id: synthetic-multi-peak-epm-eta-3
  sample: PSW-1-17/08/2004
  observation_year: 2004.6256830601094
  tracerlpm_effective_observation_year: 2004.5
  model1: EPM
  model2: EPM
  model_parameter: 2.0  # ratio TracerLPM r; eta PyAges = 3
  x_axis: SF6
  y_axis: NO3-N
  input_history: *multi_peak_input

- case_id: synthetic-multi-peak-epm-eta-10
  sample: PSW-1-17/08/2004
  observation_year: 2004.6256830601094
  tracerlpm_effective_observation_year: 2004.5
  model1: EPM
  model2: EPM
  model_parameter: 9.0  # ratio TracerLPM r; eta PyAges = 10
  x_axis: SF6
