# Phase 3 de l'étude de robustesse : extension de l'âge moyen.
#
# Les cas tau=20 ne sont pas recalculés : ils proviennent de la phase 1. Cette
# configuration ajoute tau=5 et tau=50 pour les largeurs intermédiaire et très
# large. La synthèse finale regroupera donc bien tau=5, 20 et 50.
campaign_id: tracerlpm-robustness-age-noise-v1
observation_year: 2020.0

tracers:
  - {name: cfc11, recharge: data_core/data_tracer/cfc11/recharge.csv, unit: pptv}
  - {name: cfc12, recharge: data_core/data_tracer/cfc12/recharge.csv, unit: pptv}
  - {name: cfc113, recharge: data_core/data_tracer/cfc113/recharge.csv, unit: pptv}
  - {name: sf6, recharge: data_core/data_tracer/sf6/recharge.csv, unit: pptv}

tracerlpm:
  input_history: tracerlpm-input-history.csv
  target_tracers: [CFC-11, CFC-12, CFC-113, SF6]
  source_columns: {CFC-11: cfc11, CFC-12: cfc12, CFC-113: cfc113, SF6: sf6}
  sample: PSW-1-17/08/2004
  x_axis: CFC-11
  y_axis: SF6

reuses_from_width_campaign:
  campaign_id: tracerlpm-robustness-width-noise-v1
  tau_values: [20.0]
  noise_relative_standard_deviations: [0.10, 0.20]

case_matrices:
  - case_id_pattern: robust-age-epm-tau{tau_tag}-r{shape_tag}-noise{noise_percent:02d}-seed{seed}
    model: EPM
    # tau=20 est déjà présent dans la phase 1 et sera fusionné au rapport final.
    tau_values: [5.0, 50.0]
    secondary_parameter:
      display_name: r
      model_parameter: eta
      model_offset: 1.0
      # r=2 : largeur intermédiaire; r=0.05 : distribution très large.
      values: [0.05, 2.0]
    noise_relative_standard_deviations: [0.10, 0.20]
    seeds: [401, 402, 403, 404, 405, 406, 407, 408, 409, 410]
    bounds: {tau: [0.1, 200.0], eta: [1.01, 11.0]}
    initial_values: [[5.0, 1.05], [5.0, 3.0], [20.0, 1.05], [50.0, 1.05], [50.0, 3.0], [80.0, 3.0]]

  - case_id_pattern: robust-age-dm-tau{tau_tag}-dp{shape_tag}-noise{noise_percent:02d}-seed{seed}
    model: DM
    tau_values: [5.0, 50.0]
    secondary_parameter:
      display_name: DP
      model_parameter: DP
      model_offset: 0.0
      # DP=0.2 : largeur intermédiaire; DP=1 : distribution très large.
      values: [0.2, 1.0]
    noise_relative_standard_deviations: [0.10, 0.20]
    seeds: [401, 402, 403, 404, 405, 406, 407, 408, 409, 410]
    bounds: {tau: [0.1, 200.0], DP: [0.001, 3.0]}
    initial_values: [[5.0, 0.2], [5.0, 1.0], [20.0, 0.2], [50.0, 0.2], [50.0, 1.0], [80.0, 1.0]]

objective:
  relative_standard_deviation: match_noise
  absolute_floor_fraction_of_tracer_maximum: 0.000001
