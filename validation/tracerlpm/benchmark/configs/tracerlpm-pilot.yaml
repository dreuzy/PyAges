# Single technical pilot for Phase 2. The runner always works on a copy of the
# qualified workbook and never modifies the source file.
- case_id: synthetic-constant-pfm
  # Existing sample used only for its observation date.
  sample: PSW-1-17/08/2004
  # Decimal date imposed to avoid locale ambiguity in the VBA ComboBox.
  observation_year: 2004.6256830601094
  # Two identical PFM slots provide a repeatability check.
  model1: PFM
  model2: PFM
  # Stable columns already present in the Example 1 configuration.
  x_axis: SF6
  y_axis: NO3-N
  input_history:
    # Path resolved relative to this YAML file, regardless of the terminal.
    path: ../inputs/synthetic/constant.csv
    # Fingerprint of the CSV file generated by Phase 1.
    sha256: 36D557389A15AE4BE6AE30AC88C34A82E67C70859D398D35790D9286CFFD6B66
    # Both axes receive exactly the same chronicle.
    target_tracers: [SF6, NO3-N]
    # Benchmark-wide convention before the first available point.
    before: 0.0
    # After the chronicle, retain the last value.
    after: hold_last
