# Phase 1 de l'étude de robustesse : largeur de la distribution et bruit.
#
# Tous les cas utilisent exactement les quatre mêmes traceurs. Cette campagne
# ne teste donc aucune combinaison ni suppression de traceur.
campaign_id: tracerlpm-robustness-width-noise-v1
observation_year: 2020.0

# Historiques atmosphériques utilisés pour créer les observations synthétiques
# avec la convolution de référence indépendante.
tracers:
  - {name: cfc11, recharge: data_core/data_tracer/cfc11/recharge.csv, unit: pptv}
  - {name: cfc12, recharge: data_core/data_tracer/cfc12/recharge.csv, unit: pptv}
  - {name: cfc113, recharge: data_core/data_tracer/cfc113/recharge.csv, unit: pptv}
  - {name: sf6, recharge: data_core/data_tracer/sf6/recharge.csv, unit: pptv}

# Projection des quatre historiques dans le classeur TracerLPM qualifié.
tracerlpm:
  input_history: tracerlpm-input-history.csv
  target_tracers: [CFC-11, CFC-12, CFC-113, SF6]
  source_columns: {CFC-11: cfc11, CFC-12: cfc12, CFC-113: cfc113, SF6: sf6}
  sample: PSW-1-17/08/2004
  x_axis: CFC-11
  y_axis: SF6

# Chaque matrice est le produit cartésien des valeurs ci-dessous.
# Les graines 401-410 sont réutilisées pour toutes les largeurs et tous les
# niveaux de bruit : les comparaisons entre scénarios sont donc appariées.
case_matrices:
  - case_id_pattern: robust-width-epm-tau{tau_tag}-r{shape_tag}-noise{noise_percent:02d}-seed{seed}
    model: EPM
    tau_values: [20.0]
    secondary_parameter:
      # TracerLPM expose r, tandis que PyAge utilise eta = 1 + r.
      display_name: r
      model_parameter: eta
      model_offset: 1.0
      # r faible : distribution large, proche de l'exponentielle.
      # r élevé : distribution étroite, proche du piston.
      values: [0.05, 0.5, 2.0, 9.0]
    # Incertitude relative gaussienne appliquée indépendamment aux quatre
    # concentrations; 0.20 correspond à 20 %.
    noise_relative_standard_deviations: [0.01, 0.05, 0.10, 0.20]
    seeds: [401, 402, 403, 404, 405, 406, 407, 408, 409, 410]
    bounds: {tau: [0.1, 200.0], eta: [1.01, 11.0]}
    # Couples [tau, eta] de départ; TracerLPM reçoit automatiquement eta-1.
    initial_values: [[5.0, 1.05], [20.0, 1.5], [20.0, 3.0], [20.0, 10.0], [80.0, 3.0]]

  - case_id_pattern: robust-width-dm-tau{tau_tag}-dp{shape_tag}-noise{noise_percent:02d}-seed{seed}
    model: DM
    tau_values: [20.0]
    secondary_parameter:
      display_name: DP
      model_parameter: DP
      model_offset: 0.0
      # Pour DM, CV = sigma/tau = sqrt(2*DP) : environ 0.2, 0.63, 1 et 1.41.
      values: [0.02, 0.2, 0.5, 1.0]
    noise_relative_standard_deviations: [0.01, 0.05, 0.10, 0.20]
    seeds: [401, 402, 403, 404, 405, 406, 407, 408, 409, 410]
    bounds: {tau: [0.1, 200.0], DP: [0.001, 3.0]}
    # Couples [tau, DP] de départ couvrant les distributions étroites et larges.
    initial_values: [[5.0, 0.02], [20.0, 0.02], [20.0, 0.2], [20.0, 1.0], [80.0, 0.2]]

objective:
  # PyAge emploie pour chaque cas le même écart type relatif que celui injecté.
  relative_standard_deviation: match_noise
  # Plancher numérique pour les concentrations proches de zéro.
  absolute_floor_fraction_of_tracer_maximum: 0.000001
