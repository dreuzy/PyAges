# Stable campaign identifier. It appears in every manifest.
campaign_id: tracerlpm-targeted-v1

# Common unit for all ages and time parameters.
time_unit: year

# Grid shared by the five synthetic input functions.
time_grid:
  # First covered year, inclusive.
  start_year: 1900
  # Last covered year, inclusive.
  end_year: 2025
  # Calendar interval. Phase 1 accepts only "monthly".
  frequency: monthly
  # Each value is dated at mid-month and expressed as a decimal year.
  timestamp_convention: middle_of_month

# Arbitrary unit: no physical conversion should be applied.
concentration_unit: au

# Values used outside the chronicle domain by the independent reference.
outside_domain:
  before: 0.0
  after: hold_last

# Deterministic definition of the input functions.
synthetic_inputs:
  constant:
    value: 100.0
  ramp:
    start_value: 0.0
    end_value: 100.0
  step:
    transition_year: 1960.0
    low_value: 0.0
    high_value: 100.0
  rectangular_pulse:
    start_year: 1960.0
    end_year: 1965.0
    baseline: 0.0
    amplitude: 100.0
  multi_peak:
    baseline: 0.0
    # Gaussian peaks: center in years, width in years, and amplitude in au.
    peaks:
      - {center_year: 1945.0, width_years: 2.0, amplitude: 25.0}
      - {center_year: 1965.0, width_years: 4.0, amplitude: 100.0}
      - {center_year: 1990.0, width_years: 7.0, amplitude: 55.0}

# Candidate dates. The case builder will remove duplicates.
observation_years: [1995.0, 2010.0, 2020.0]

# Factors applied to the absolute and relative tolerances of the tracer-driven
# grid. A value below 1 tightens the tolerances.
pyages_grid_tolerance_scales: [4.0, 2.0, 1.0, 0.5, 0.25]

# Forward qualification contract. Thresholds are normalized by the maximum
# amplitude of each input history. In the significant regime, the error is the
# symmetric relative difference. Near zero, an absolute error avoids
# artificially large ratios.
forward_qualification:
  contract_version: 1
  significant_concentration_fraction_of_input_scale: 0.001
  maximum_significant_symmetric_relative_difference: 0.0005
  maximum_near_zero_absolute_difference_fraction_of_input_scale: 0.00002
  physical_bound_tolerance_fraction_of_input_scale: 0.000000000001
  require_all_cases: true

# Parameterizations proposed in the approved protocol.
models:
  PFM:
    tau: [1.0, 20.0, 80.0]
  EMM:
    tau: [1.0, 20.0, 80.0]
  EPM:
    tau: [10.0, 40.0]
    eta: [1.5, 3.0, 10.0]
  DM:
    tau: [10.0, 40.0]
    DP: [0.02, 0.2, 1.0]

# Synthetic observation regimes for the future inversion.
noise:
  none:
    kind: none
  low_deterministic:
    kind: gaussian_relative
    relative_standard_deviation: 0.02
    seed: 20260817
  repeated:
    kind: gaussian_relative
    relative_standard_deviation: 0.05
    seeds: [20260818, 20260819, 20260820]
