# Adapter between the runner and the workbook's internal structure.
# Each new workbook version must have its own qualified mapping.

# Exact hash of the only workbook to which this mapping may be applied.
workbook_sha256: 92F1D717AF519B9E0A701438BC99061D7633FD71C90A0657B787A0C563DFB179

# Sheet containing the tracer-tracer graphical interface.
graph_sheet: TracerTracerGraphs
# VBA CodeName used to build the full names of event macros.
graph_sheet_code_name: Sheet5
# Cell actually used by curve calculations for the model date.
graph_observation_year_cell: E13
# EPM/PEM/DM parameter associated with each of the two model slots.
graph_model1_parameter_cell: K5
graph_model2_parameter_cell: K7
# Hidden sheet containing the computed numeric curves.
output_sheet: TracerTracerOutput
# Sheet containing the measurements for the selected sample.
sample_sheet: Samples

# Controlled import of shared chronicles into the working copy.
input_sheet: TracerInput
# Internal date grid used by the workbook's XLL functions.
input_date_range: A19:A359
# Columns available in this exact workbook configuration.
input_value_columns:
  3H: C
  SF6: G
  NO3-N: H
# Metadata rows to neutralize for a stable synthetic chronicle.
input_unsaturated_time_row: 9
input_half_life_row: 12
input_decay_rate_row: 14
input_scaling_factor_row: 17

controls:
  # ListBox of samples displayed on the graph.
  samples_to_graph: GraphsLB1
  # ComboBox for the sample used in the calculation.
  sample_to_model: SamplesCombo
  # ComboBox for the first model slot.
  model1: ModelCombo1
  # ComboBox for the second model slot.
  model2: ModelCombo2
  # ComboBox for the tracer on the horizontal axis.
  x_axis: Graph1x
  # ComboBox for the tracer on the vertical axis.
  y_axis: Graph1y

# Order matching the interactive sequence validated in Excel.
event_macros:
  # Update the active sample and associated cells.
  - SamplesCombo_Click
  # Update the selection of displayed samples.
  - GraphsLB1_Change
  # Update the horizontal tracer.
  - Graph1x_Click
  # Update the vertical tracer.
  - Graph1y_Click
  # Recalculate and configure the first model after selecting the axes.
  - ModelCombo1_Change
  # Recalculate and configure the second model after selecting the axes.
  - ModelCombo2_Change

output_ranges:
  # Historical ranges retained for compatibility with older reports.
  model1: P3:Q63
  model2: Z3:AA63
  # Complete blocks: the runner resolves columns from the row 2 headers.
  model1_block: M:V
  model2_block: W:AF
  model_header_row: 2
  model_first_data_row: 3
  model_last_data_row: 63
  # Measured X/Y pair for the active sample.
  sample: G6:H6
  # Tau ages corresponding row by row to the 61 model pairs.
  model_ages: K3:K63

# Minimal mapping of the tracer-tracer inversion sheet.
fit:
  sheet: TracerTracerFits
  sheet_code_name: Sheet19
  sample_control: SampleList
  model_control: ModelListCombo
  tracer_control: TracerList
  observation_year_cell: E18
  observation_cells:
    3H: F6
    SF6: J6
    NO3-N: K6
  age_cell: E12
  age_lower_cell: F12
  age_upper_cell: G12
  model_parameter_cell: H12
  model_parameter_lower_cell: I12
  model_parameter_upper_cell: J12
  # Values optimized directly by Solver; row 33 is populated only after the
  # interactive dialog box of the TracerLPM macro.
  result_age_cell: E12
  result_objective_cell: E27
  tracer_selection_label_cell: F27
  calculated_cells:
    3H: F18
    SF6: J18
    NO3-N: K18
  decay_rate_cells:
    3H: F17
    SF6: J17
    NO3-N: K17
