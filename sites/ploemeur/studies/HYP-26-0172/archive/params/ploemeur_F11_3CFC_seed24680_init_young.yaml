# Legacy F11 controlled alternative initialization (young solution).

workflows:
  breakups: [2012]
  prior_pipeline: ["double_prior"]

observations:
  conc_error_rel: [0.2]
  wells: ["F11"]
  well_dates:
    F11: {start: 2004, end: 2024}

lpm_models:
  default: ["exp_shifted"]
  directory: sites/ploemeur/params_lpm
  by_well:
    F11: ["exp_shifted"]

calibration:
  explo_res: 20
  mh_nsteps: 40000
  seed_enabled: true
  seed: 24680
  initial_params:
    mu: 5.0
    shift: 5.0
  lpm_number: 0

execution:
  parallel: true
  auto_proc_nb: false
  proc_nb: 6

results:
  use_default: false
  directory: results/ploemeur_F11_3CFC_seed24680_init_young
