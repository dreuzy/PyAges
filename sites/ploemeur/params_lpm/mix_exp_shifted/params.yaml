# Canonical Ploemeur LPM configuration.
# Defines calibration ranges, initialization, proposal steps, and analytical priors.

model: mix_exp_shifted
version: 1

parameters:
  - name: rate
    label: mix_rate
    description: "Mixing rate between components."
    calibration_range: [0.0, 1.0]
    init: 0.5
    step: 0.1
    prior:
      type: uniform
      min: 0.0
      max: 1.0
      unit: year

  - name: mu1
    label: mean_age_1
    unit: year
    description: "First mean parameter."
    calibration_range: [0.1, 50.0]
    init: 10.0
    step: 0.5
    prior:
      type: uniform
      min: 0.0
      max: 50.0
      unit: year

  - name: mu2
    label: mean_age_2
    unit: year
    description: "Second mean parameter."
    calibration_range: [0.1, 50.0]
    init: 10.0
    step: 0.5
    prior:
      type: uniform
      min: 0.0
      max: 50.0
      unit: year

  - name: shift
    label: time_shift
    unit: year
    description: "Temporal shift applied to the distribution."
    calibration_range: [0.1, 50.0]
    init: 10.0
    step: 0.5
    prior:
      type: uniform
      min: 0.0
      max: 100.0
      unit: year

notes: "Ploemeur-specific calibration settings."
