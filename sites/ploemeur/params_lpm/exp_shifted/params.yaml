# Canonical Ploemeur LPM configuration.
# Defines calibration ranges, initialization, proposal steps, and analytical priors.

model: exp_shifted
version: 1

parameters:
  - name: mu
    label: mean_age
    unit: year
    description: "Mean of the distribution."
    calibration_range: [0.1, 70.0]
    init: 10.0
    step: 1.5
    prior:
      type: normal
      mean: 25.0
      std: 5.0
      unit: year

  - name: shift
    label: time_shift
    unit: year
    description: "Temporal shift applied to the distribution."
    calibration_range: [0.0, 70.0]
    init: 10.0
    step: 1.5
    prior:
      type: normal
      mean: 10.0
      std: 2.0
      unit: year

notes: "Ploemeur-specific calibration settings."
