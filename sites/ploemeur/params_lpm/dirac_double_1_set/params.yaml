# Canonical Ploemeur LPM configuration.
# Defines calibration ranges, initialization, proposal steps, and analytical priors.

model: dirac_double_1_set
version: 1

parameters:
  - name: mufree
    label: mean_age_free
    unit: year
    description: "Free mean parameter."
    calibration_range: [0.0, 70.0]
    init: 10.0
    step: 2.0
    prior:
      type: uniform
      min: 0.0
      max: 70.0
      unit: year

  - name: rate
    label: mix_rate
    description: "Mixing rate between components."
    calibration_range: [0.0, 1.0]
    init: 0.3
    step: 0.1
    prior:
      type: uniform
      min: 0.0
      max: 1.0
      unit: "-"
notes: "Ploemeur-specific calibration settings."
