# Canonical Ploemeur LPM configuration.
# Defines bounds, initialization, proposal steps, and analytical priors.

model: gamma
version: 1

parameters:
  - name: k
    label: shape_k
    unit: "--"
    description: "Shape parameter."
    bounds: [0.1, 10.0]
    init: 2.0
    step: 0.5
    prior:
      type: uniform
      min: 0.0
      max: 10.0
      unit: "--"
  - name: scale
    label: scale
    unit: year
    description: "Scale parameter."
    bounds: [0.1, 80.0]
    init: 10.0
    step: 1.0
    prior:
      type: uniform
      min: 0.0
      max: 100.0
      unit: year

notes: "Ploemeur-specific calibration settings."
