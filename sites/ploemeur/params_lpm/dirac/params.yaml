# Canonical Ploemeur LPM configuration.
# Defines calibration ranges, initialization, proposal steps, and analytical priors.

model: dirac
version: 1

parameters:
  - name: mu
    label: mean_age
    unit: year
    description: "Mean of the distribution."
    calibration_range: [0.0, 100.0]
    init: 10.0
    step: 1.0
    prior:
      type: uniform
      min: 0.0
      max: 100.0
      unit: year

notes: "Ploemeur-specific calibration settings."
