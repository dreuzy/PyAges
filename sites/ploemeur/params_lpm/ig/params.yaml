# Canonical Ploemeur LPM configuration.
# Defines bounds, initialization, proposal steps, and analytical priors.

model: ig
version: 1

parameters:
  - name: mu
    label: mean_age
    unit: year
    description: "Mean of the distribution."
    bounds: [0.1, 70.0]
    init: 10.0
    step: 1.5
    prior:
      type: uniform
      min: 0.0
      max: 100.0
      unit: year

  - name: sigma
    label: std_age
    unit: year
    description: "Standard deviation (spread) parameter."
    bounds: [0.1, 70.0]
    init: 2.0
    step: 1.0
    prior:
      type: uniform
      min: 0.0
      max: 30.0
      unit: year

notes: "Ploemeur-specific calibration settings."
