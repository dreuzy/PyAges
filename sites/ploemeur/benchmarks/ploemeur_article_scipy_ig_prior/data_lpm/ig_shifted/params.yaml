model: ig_shifted
version: 1

# Benchmark-only rectangular envelope of the transformed article support.
# The named joint prior applies the curvilinear shape/scale support. Generic
# PyAges/Ploemeur inverse-Gaussian defaults are intentionally unchanged.
parameters:
  - name: mu
    label: physical_mean
    unit: year
    description: "Physical IG mean M; benchmark envelope only."
    calibration_range: [0.01, 3000.0]
    init: 2400.0
    step: 100.0
    prior:
      type: uniform
      min: 0.01
      max: 3000.0
      unit: year

  - name: sigma
    label: physical_standard_deviation
    unit: year
    description: "Physical IG standard deviation S; benchmark envelope only."
    calibration_range: [0.00316227766016838, 30000.0]
    init: 21000.0
    step: 1000.0
    prior:
      type: uniform
      min: 0.00316227766016838
      max: 30000.0
      unit: year

  - name: shift
    label: time_shift
    unit: year
    description: "Shift t0 on the exact article support."
    calibration_range: [0.1, 50.0]
    init: 34.0
    step: 0.5
    prior:
      type: uniform
      min: 0.1
      max: 50.0
      unit: year

notes: >-
  Dedicated Ploemeur Article.docx non-regression benchmark. Use only with
  prior_type=ploemeur_article_scipy_ig_prior, whose log-density is
  constant-log(S) on the transformed article (shape,scale,t0) support.
