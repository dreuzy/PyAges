[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pyage-groundwater"
dynamic = ["version"]
description = "Groundwater Age Dating Toolkit using Lumped Parameter Models"
readme = "README.md"
license = "CECILL-2.1"
license-files = ["LICENSE"]
authors = [{name = "Jean-Raynald de Dreuzy"}]
keywords = ["groundwater", "age dating", "lumped parameter model", "hydrogeology", "tracers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
]
requires-python = ">=3.9,<3.14"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "openpyxl>=3.1",
    "matplotlib>=3.4",
    "pyyaml>=5.4",
    "click>=8.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "ruff>=0.6",
    "twine>=5.0",
]
docs = [
    "sphinx>=7.2,<9",
    "myst-parser>=3,<5",
    "sphinx-rtd-theme>=2,<4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://gitlab.univ-rennes1.fr/aupepin/pyage.git"
Repository = "https://gitlab.univ-rennes1.fr/aupepin/pyage.git"

[project.scripts]
pyage = "pyage.cli.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pyage*", "data_core*"]

[tool.setuptools.package-data]
data_core = [
    "data_lpm/*/*.yaml",
    "data_tracer/*/*.csv",
    "data_tracer/*/*.txt",
    "data_tracer/*/*.yaml",
]

[tool.setuptools.dynamic]
version = {attr = "pyage._version.__version__"}

[tool.pytest.ini_options]
addopts = ["--ignore=validation/tracerlpm/output"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
