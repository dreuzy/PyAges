[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pyages"
dynamic = ["version"]
description = "Groundwater Age Dating Toolkit using Lumped Parameter Models"
readme = "README.md"
license = "CECILL-2.1"
license-files = [
    "LICENSE",
    "LICENSE.en",
    "COPYRIGHT",
    "NOTICE-DATA.md",
    "THIRD_PARTY_NOTICES.md",
]
authors = [{name = "Jean-Raynald de Dreuzy"}]
keywords = ["groundwater", "age dating", "lumped parameter model", "hydrogeology", "tracers"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Hydrology",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.14.1,<1.19; python_version < '3.14'",
    "scipy>=1.16.1,<1.19; python_version >= '3.14'",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "pyyaml>=6,<7",
    "click>=8.3.3,<9",
    "pydantic>=2.9,<3",
    "packaging>=24,<27",
]

[project.optional-dependencies]
dev = [
    "build>=1.5,<2",
    "pip-audit>=2.10,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "pyright>=1.1.411,<2",
    "ruff>=0.16,<1",
    "twine>=7,<8",
]
docs = [
    "sphinx>=9,<10",
    "myst-parser>=5,<6",
    "sphinxcontrib-mermaid>=2,<3",
    "sphinx-rtd-theme>=3.1,<4",
]
examples = [
    "openpyxl>=3.1,<4",
    "ipython>=9.16,<10",
    "jupyterlab>=4.6.3,<5",
]

[project.urls]
Homepage = "https://github.com/dreuzy/PyAges"
Documentation = "https://pyage-gw.readthedocs.io/en/latest/"
Repository = "https://github.com/dreuzy/PyAges.git"
Issues = "https://github.com/dreuzy/PyAges/issues"
Changelog = "https://github.com/dreuzy/PyAges/blob/main/CHANGELOG.md"

[project.scripts]
pyages = "pyages.cli.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pyages*", "data_core*"]

[tool.setuptools.package-data]
data_core = [
    "README.md",
    "data_lpm/*/*.yaml",
    "data_tracer/*/*.csv",
    "data_tracer/*/*.txt",
    "data_tracer/*/*.yaml",
]

[tool.setuptools.dynamic]
version = {attr = "pyages._version.__version__"}

[tool.pytest.ini_options]
addopts = ["--ignore=validation/tracerlpm/output"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright]
include = [
    "pyages/calibration/methods/base.py",
    "pyages/calibration/methods/mh/_prior_support.py",
    "pyages/calibration/sampling_schedule.py",
    "pyages/convolution/settings.py",
    "pyages/tracer/protocols.py",
    "pyages/workflows/runtime/_manifest_types.py",
    "scripts/common/provenance.py",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
