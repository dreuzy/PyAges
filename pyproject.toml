[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyage"
version = "0.1.0"
description = "Groundwater Age Dating Toolkit using Lumped Parameter Models"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jean-Raynald de Dreuzy"}]
keywords = ["groundwater", "age dating", "lumped parameter model", "hydrogeology", "tracers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "pyyaml>=5.4",
    "click>=8.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
]

[project.urls]
Homepage = "https://gitlab.univ-rennes1.fr/aupepin/pyage.git"
Repository = "https://gitlab.univ-rennes1.fr/aupepin/pyage.git"

[project.scripts]
pyage = "pyage.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyage*", "scripts*", "data_core*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.csv", "*.txt"]
