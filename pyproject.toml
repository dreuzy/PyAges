[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pyage-groundwater"
dynamic = ["version"]
description = "Groundwater Age Dating Toolkit using Lumped Parameter Models"
readme = "README.md"
license = "CECILL-2.1"
license-files = ["LICENSE", "NOTICE-DATA.md"]
authors = [{name = "Jean-Raynald de Dreuzy"}]
keywords = ["groundwater", "age dating", "lumped parameter model", "hydrogeology", "tracers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Hydrology",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "pyyaml>=6,<7",
    "click>=8.3.3,<9",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.5,<2",
    "pip-audit>=2.10,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<1",
    "twine>=7,<8",
]
docs = [
    "sphinx>=9,<10",
    "myst-parser>=5,<6",
    "sphinxcontrib-mermaid>=2,<3",
    "sphinx-rtd-theme>=3.1,<4",
]
examples = [
    "openpyxl>=3.1,<4",
    "ipython>=9.16,<10",
    "jupyterlab>=4.6.3,<5",
]

[project.urls]
Homepage = "https://github.com/dreuzy/pyage"
Documentation = "https://pyage-groundwater.readthedocs.io/en/latest/"
Repository = "https://github.com/dreuzy/pyage.git"

[project.scripts]
pyage = "pyage.cli.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pyage*", "data_core*"]

[tool.setuptools.package-data]
data_core = [
    "data_lpm/*/*.yaml",
    "data_tracer/*/*.csv",
    "data_tracer/*/*.txt",
    "data_tracer/*/*.yaml",
]

[tool.setuptools.dynamic]
version = {attr = "pyage._version.__version__"}

[tool.pytest.ini_options]
addopts = ["--ignore=validation/tracerlpm/output"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
