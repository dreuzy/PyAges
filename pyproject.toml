[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyage"
version = "0.1.0"
description = "Groundwater Age Dating Toolkit using Lumped Parameter Models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "pyyaml>=5.4",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
]

[project.scripts]
pyage = "pyage.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyage*", "scripts*", "data_core*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.csv", "*.txt"]
