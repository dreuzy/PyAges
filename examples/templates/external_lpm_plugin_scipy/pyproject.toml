# Standalone packaging metadata for the external SciPy-backed reference plugin.
# Installing this project records the ``pyages.lpms`` entry point below.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyages-lpm-gamma-mean"
version = "0.1.0"
description = "Complete SciPy-backed external LPM example for PyAges"
requires-python = ">=3.12,<3.15"
dependencies = ["pyages>=1.0,<2", "numpy>=2,<3", "scipy>=1.14,<1.19"]

[project.entry-points."pyages.lpms"]
gamma_mean = "pyages_lpm_gamma_mean.model:definition"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the parameter schema inside both wheels and source distributions.
pyages_lpm_gamma_mean = ["data_lpm/*/params.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
