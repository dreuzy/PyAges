# Minimal temporal quickstart (fast, no plots).

schema_version: 3

data:
  # Schema 3 resolves this path from the directory containing this YAML file.
  file: ../natural/ploemeur_temporal/data/ori_ploemeur_F09_2005_2024.txt
  error_rel: 0.2
  missing_error_rel: 0.01

lpm:
  models: ["exp_shifted"]
  directory: ../../data_core/data_lpm

workflow:
  kind: temporal
  mode: span

calibration:
  # These two controls affect temporal preparation and plots, not MH itself.
  exploration_resolution: 10
  posterior_draw_count: 10
  metropolis_hastings:
    nsteps: 200
    burn_in: 0.2
    thinning: 10
    seed: 12345
    prior_option: true
    # One and many chains use these same fields. Set chains to 4 and enable the
    # pilot for a convergence study; also raise nsteps (for example to 5000).
    chains: 1
    initialization:
      strategy: bounds_stratified
    pilot:
      enabled: false
      nsteps: 2000
      proposal_multiplier: auto
    diagnostics:
      max_rhat: 1.01
      min_bulk_ess: 300
      min_tail_ess: 300
      require_convergence: true

reporting:
  temporal: false
  distributions: false

output:
  study_name: temporal
  use_default: true
  directory: ""
