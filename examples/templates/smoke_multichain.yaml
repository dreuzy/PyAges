# Fast multi-chain installation smoke test.
#
# This profile exercises the complete CLI/YAML, pilot-covariance, diagnostics,
# serialization, and manifest path.  Its deliberately short chains are not a
# scientific convergence qualification; use one of the maintained extensive
# profiles documented in docs/user-guide/multichain-mh.md for that purpose.

schema_version: 3

workflow:
  kind: single_date

data:
  name: ploemeur_F09_2010.txt
  year: 2010
  data_dir: ../natural/ploemeur/data
  verbose: false
  missing_error_rel: 0.01

lpm:
  models: [exp_shifted]
  directory: ../../data_core/data_lpm

run:
  reachable_concentrations: false
  objective_function: false
  metropolis_hastings: true
  simplex: false

calibration:
  metropolis_hastings:
    nsteps: 120
    burn_in: 0.1
    thinning: 10
    prior_option: false
    likelihood: true
    display_traj: false
    chains: 2
    seed: 20260831
    initialization:
      strategy: bounds_stratified
    pilot:
      enabled: true
      nsteps: 40
      burn_in: 0.25
      relative_ridge: 1.0e-6
      proposal_multiplier: auto
      save_samples: true
    diagnostics:
      max_rhat: 1.01
      min_bulk_ess: 300
      min_tail_ess: 300
      require_convergence: false

output:
  study_name: smoke_multichain
