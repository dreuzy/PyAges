model: bounded_power
version: 1

parameters:
  - name: tau
    label: maximum_age
    unit: year
    description: "Upper bound of the finite transit-time support."
    bounds: [0.1, 200.0]
    init: 50.0
    step: 2.0
    prior:
      type: uniform
      min: 0.1
      max: 200.0
      unit: year

  - name: alpha
    label: power_shape
    unit: dimensionless
    description: "Positive exponent controlling concentration toward old ages."
    bounds: [0.1, 20.0]
    init: 2.0
    step: 0.2
    prior:
      type: uniform
      min: 0.1
      max: 20.0
      unit: dimensionless

notes: >-
  Pedagogical bounded power-law distribution. Scientific use requires an
  application-specific justification.
