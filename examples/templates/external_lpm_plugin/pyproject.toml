# Standalone packaging metadata for the external bounded-power reference plugin.
# Installing this project records the ``pyages.lpms`` entry point below.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyages-lpm-bounded-power"
version = "0.1.0"
description = "Complete external LPM example for PyAges"
requires-python = ">=3.12,<3.15"
dependencies = ["pyages>=1.0,<2", "numpy>=2,<3"]

[project.entry-points."pyages.lpms"]
bounded_power = "pyages_lpm_bounded_power.model:definition"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the parameter schema inside both wheels and source distributions.
pyages_lpm_bounded_power = ["data_lpm/*/params.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
