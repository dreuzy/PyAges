# Minimal single-date quickstart (fast, no interactive plots).

dataset:
  name: ploemeur_F09_2010.txt
  year: 2010
  data_dir: examples/natural/ploemeur/data
  verbose: false
  missing_error_rel: 0.01  # Fill only zero errors from tracer means

lpm:
  model_name: exp_shifted
  data_directory: data_core/data_lpm

# Turn analyses on/off. Keep all false for a fast smoke run.
run:
  reachable_concentrations: false
  objective_function: false
  calibration_metropolis_hastings: false
  calibration_simplex: false

# If you enable the sections above, these values will be used.
reachable_concentrations:
  nmodels: 200

objective_function:
  nmodels: 500

calibration_metropolis_hastings:
  nstep: 200
  burn_in: 0.2
  nskip: 10
  seed: 12345
  prior_option: false
  likelihood: true
  monitor: false
  display_traj: false
  # Multi-chain MH is opt-in. Uncomment this block for an ensemble; leaving it
  # absent preserves the one-chain quickstart. Also raise nstep (for example
  # to 5000): the configured ESS gates must be reachable from retained draws.
  # multichain:
  #   enabled: true
  #   chains: 4
  #   master_seed: 12345
  #   initialization:
  #     strategy: bounds_stratified
  #   pilot:
  #     enabled: true
  #     nstep: 2000
  #     covariance_mode: pooled_within_chain
  #     proposal_multiplier: auto
  #   diagnostics:
  #     max_rhat: 1.01
  #     min_bulk_ess: 300
  #     min_tail_ess: 300
  #     require_convergence: true

calibration_simplex:
  init_multiples_n: 2
  fuq_n: 5
