dataset:
  name: SSW_2007.txt
  label: Albuquerque shape-free old-bin example
  year: 2007
  data_dir: examples/natural/albuquerque/data
  verbose: true
  missing_error_rel: 0.01

lpm:
  model_name: shapefree_n_oldbin
  data_directory: examples/natural/albuquerque/data_lpm

run:
  reachable_concentrations: false
  objective_function: false
  calibration_metropolis_hastings: true
  calibration_simplex: false

reachable_concentrations:
  nmodels: 5000

objective_function:
  nmodels: 10000

calibration_metropolis_hastings:
  nstep: 4000
  prior_option: false
  likelihood: true
  monitor: false
  display_traj: false

calibration_simplex:
  init_multiples_n: 3
  fuq_n: 30
