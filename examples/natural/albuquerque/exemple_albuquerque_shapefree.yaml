schema_version: 3

workflow:
  kind: single_date

data:
  name: SSW_2007.txt
  label: Albuquerque shape-free old-bin example
  year: 2007
  data_dir: data
  verbose: true
  missing_error_rel: 0.01

lpm:
  models: [shapefree_n_oldbin]
  directory: data_lpm

run:
  reachable_concentrations: false
  objective_function: false
  metropolis_hastings: true
  simplex: false

reachable_concentrations:
  nmodels: 5000

objective_function:
  nmodels: 10000

calibration:
  metropolis_hastings:
    nsteps: 4000
    prior_option: false
    likelihood: true
    display_traj: false

  simplex:
    init_multiples_n: 3
    fuq_n: 30
