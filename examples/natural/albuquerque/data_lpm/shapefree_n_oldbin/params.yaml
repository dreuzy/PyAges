# LPM parameters for a support-aware shape-free Albuquerque example.
#
# The last bin starts at the last configured edge and ends at the LPM-defined
# maximum support. If a tracer offers a shorter time support, convolution
# naturally truncates the integral on the available time grid.

model: shapefree_n_oldbin
version: 1

shapefree:
  mode: support_open
  edges: [0.0, 5.0, 15.0, 30.0, 45.0]
  labels: ["0-5", "5-15", "15-30", "30-45", "old"]
  parameterization: stick_breaking
  support_end_max: 120.0

parameters:
  - name: z1
    label: latent_fraction_1
    unit: "-"
    description: "Stick-breaking latent controlling the first age-bin fraction."
    domain: {min: null, max: null}
    calibration_range: [-8.0, 8.0]
    init: 0.0
    step: 0.5
    prior:
      type: uniform
      min: -8.0
      max: 8.0
      unit: "-"

  - name: z2
    label: latent_fraction_2
    unit: "-"
    description: "Stick-breaking latent controlling the second age-bin fraction."
    domain: {min: null, max: null}
    calibration_range: [-8.0, 8.0]
    init: 0.0
    step: 0.5
    prior:
      type: uniform
      min: -8.0
      max: 8.0
      unit: "-"

  - name: z3
    label: latent_fraction_3
    unit: "-"
    description: "Stick-breaking latent controlling the third age-bin fraction."
    domain: {min: null, max: null}
    calibration_range: [-8.0, 8.0]
    init: 0.0
    step: 0.5
    prior:
      type: uniform
      min: -8.0
      max: 8.0
      unit: "-"

  - name: z4
    label: latent_fraction_4
    unit: "-"
    description: "Stick-breaking latent controlling the fourth age-bin fraction."
    domain: {min: null, max: null}
    calibration_range: [-8.0, 8.0]
    init: 0.0
    step: 0.5
    prior:
      type: uniform
      min: -8.0
      max: 8.0
      unit: "-"

notes: "Example-specific 5-bin shape-free model with an open old bin for Albuquerque."
