schema_version: 3

workflow:
  kind: single_date

data:
  # Identifier of the dataset file (directory + basename).
  # Example: "ploemeur_F09_2010.txt" maps to examples/natural/ploemeur/data/ploemeur_F09_2010.txt
  name: ploemeur_F09_2010.txt
  label: Ploemeur single-date example
  # Reference year for labels/metadata (not required for file IO).
  year: 2010
  # Schema-2 paths are relative to this YAML file.
  data_dir: data
  # Print extra diagnostics during loading.
  verbose: true
  missing_error_rel: 0.01

lpm:
  # LPM model identifier as expected by build_lpm.
  models: [exp_shifted]
  # Directory containing LPM params.yaml files, relative to this YAML file.
  directory: ../../../data_core/data_lpm

run:
  # Toggle the main processing blocks.
  # reachable_concentrations: explore the feasible concentration domain.
  reachable_concentrations: true
  # objective_function: evaluate the objective function on a parameter grid.
  objective_function: true
  # metropolis_hastings: run the MH MCMC calibration strategy.
  metropolis_hastings: true
  # simplex: run the forward UQ / simplex-based calibration.
  simplex: true

reachable_concentrations:
  # Number of systematic samples for reachable concentrations.
  nmodels: 5000

objective_function:
  # Grid size for objective function evaluation.
  nmodels: 10000

calibration:
  metropolis_hastings:
    # MCMC steps (higher = more accurate but slower).
    nsteps: 5000
    # Prior usage and likelihood options.
    prior_option: false
    likelihood: true
    # Optional trajectory figures are written separately for every chain.
    display_traj: false

  simplex:
    # Initial simplex multiplicity and FUQ sampling size.
    init_multiples_n: 3
    fuq_n: 30
