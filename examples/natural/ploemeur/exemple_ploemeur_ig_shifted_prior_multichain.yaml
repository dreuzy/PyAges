# Reproducible prior-active, three-parameter qualification profile for Ploemeur
# F09 (2010). The field data do not provide a known parameter truth. In
# particular, convergence does not remove posterior contact with the
# sigma <= 30 year support used by the canonical parametric prior.
schema_version: 3

workflow:
  kind: single_date

data:
  name: ploemeur_F09_2010.txt
  label: Ploemeur F09 2010 ig_shifted prior-active multi-chain qualification
  year: 2010
  data_dir: data
  verbose: true
  # The source rows contain zero uncertainty placeholders. Twenty percent
  # matches the maintained inverse-Gaussian Ploemeur study assumption.
  missing_error_rel: 0.20

lpm:
  models: [ig_shifted]
  directory: ../../../data_core/data_lpm

output:
  study_name: ploemeur_f09_ig_shifted_prior_multichain

run:
  reachable_concentrations: false
  objective_function: false
  metropolis_hastings: true
  simplex: false

calibration:
  metropolis_hastings:
    nsteps: 15000
    burn_in: 0.2
    thinning: 1
    prior_option: true
    likelihood: true
    display_traj: false
    chains: 5
    seed: 20260831
    initialization:
      # Exercise the active parametric-prior sampler directly. Each marginal
      # is conditioned on its intersection with the LPM calibration ranges; this
      # is exact bounded-quantile sampling, not rejection sampling.
      strategy: prior_sample
    pilot:
      enabled: true
      nsteps: 5000
      # The dispersed starts need time to reach the posterior geometry before
      # their within-chain variation is used to estimate the covariance.
      burn_in: 0.75
      relative_ridge: 1.0e-6
      proposal_multiplier: auto
      save_samples: false
    diagnostics:
      max_rhat: 1.01
      min_bulk_ess: 300
      min_tail_ess: 300
      require_convergence: true
