# Temporal MH example (multi-date concentrations).

schema_version: 3

data:
  # Input concentrations file (multi-date).
  file: data/ori_ploemeur_F09_2005_2024.txt
  # Relative concentration error (applied if error column is zero).
  error_rel: 0.2
  # Fallback relative to tracer means for any error still equal to zero.
  missing_error_rel: 0.01

lpm:
  # LPMs to evaluate (defaults to exp_shifted, ig, ig_shifted).
  models: ["exp_shifted", "ig", "ig_shifted"]
  # LPM parameter files location.
  directory: ../../../data_core/data_lpm

workflow:
  kind: temporal
  # span: single calibration over full time span
  # successive: one calibration per observation date
  mode: span

calibration:
  # Systematic sampling resolution (forward models).
  exploration_resolution: 20
  # Number of posterior draws for outputs (0 => automatic).
  posterior_draw_count: 0
  metropolis_hastings:
    # Metropolis-Hastings steps.
    nsteps: 3000
    # Burn-in fraction and thinning.
    burn_in: 0.2
    thinning: 10
    # Supplying a seed makes the run reproducible.
    seed: 12345
    prior_option: true

reporting:
  # Temporal chronicle plots.
  temporal: true
  # Distribution plots (parameters + concentrations).
  distributions: true
  # 2D concentration pair plots (concentrations2D_*.png).
  concentrations_2d: false

output:
  # Site/example namespace; the reusable workflow defaults to "temporal".
  study_name: ploemeur_temporal
  # Use default results root (PYAGES_RESULTS_DIR or <home>/results/PyAges).
  use_default: true
  # Custom results root (used only when use_default is false).
  directory: ""
