schema_version: 3

workflow:
  kind: single_date

data:
  name: ploemeur_F09_2010_ig_shifted.txt
  label: Ploemeur single-date example (ig_shifted)
  year: 2010
  data_dir: data
  verbose: true
  missing_error_rel: 0.01

lpm:
  models: [ig_shifted]
  directory: ../../../../data_core/data_lpm

run:
  reachable_concentrations: true
  objective_function: true
  metropolis_hastings: true
  simplex: true
reachable_concentrations:
  nmodels: 5000
objective_function:
  nmodels: 10000
calibration:
  metropolis_hastings:
    nsteps: 5000
    prior_option: false
    likelihood: true
    display_traj: false
  simplex:
    init_multiples_n: 3
    fuq_n: 30
