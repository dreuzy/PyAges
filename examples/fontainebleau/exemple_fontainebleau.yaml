dataset:
  # Example: "fontainebleau_CGEB" maps to examples/fontainebleau/data/fontainebleau_CGEB
  name: fontainebleau_CGEB
  year: 2010
  # Directory containing dataset files
  data_dir: examples/fontainebleau/data
  # Print dataset path and summary at startup
  verbose: true

lpm:
  # Default LPM model used for this example
  model_name: dirac_double
  # LPM data directory for this example
  data_directory: examples/fontainebleau/data/data_lpm

run:
  # Compute reachable concentrations (sampling-based)
  reachable_concentrations: true
  # Compute objective function on a grid
  objective_function: true
  # Run Metropolis-Hastings calibration
  calibration_metropolis_hastings: true
  # Run simplex / forward uncertainty quantification
  calibration_simplex: true

reachable_concentrations:
  # Number of sampled models for reachability
  nmodels: 5000

objective_function:
  # Number of sampled models for objective function grid
  nmodels: 10000

calibration_metropolis_hastings:
  # Number of M-H steps
  nstep: 5000
  # Use prior only (no likelihood) if true
  prior_option: false
  # Use likelihood if true
  likelihood: true
  # Print convergence diagnostics
  monitor: false
  # Display the M-H trajectory
  display_traj: false

calibration_simplex:
  # Initial simplex multiplier
  init_multiples_n: 3
  # Number of forward-uncertainty models
  fuq_n: 30
