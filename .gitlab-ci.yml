stages:
  - quality
  - test
  - documentation
  - package

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip

ruff:
  stage: quality
  script:
    - python -m pip install -c install/constraints.txt -e ".[dev]"
    - python -m ruff check .
    - python -m ruff format --check .

dependency-audit:
  stage: quality
  script:
    - python -m pip install -c install/constraints.txt -e ".[dev,docs,examples]"
    - python -m pip check
    - python -m pip_audit --local --skip-editable --progress-spinner off

conda-environment:
  stage: quality
  image:
    name: mambaorg/micromamba:2.9.0
    entrypoint: [""]
  before_script: []
  script:
    - micromamba create --dry-run --yes --name pyage-audit --file install/environment.yml

tests:
  stage: test
  image: "python:${PYTHON_VERSION}-slim"
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13", "3.14"]
  script:
    - python -m pip install -c install/constraints.txt -e ".[dev]"
    - python -m pytest -q

extensive-tests:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
      allow_failure: true
  script:
    - python -m pip install -c install/constraints.txt -e ".[dev]"
    - python -m pytest -q --run-extensive

coverage:
  stage: test
  script:
    - python -m pip install -c install/constraints.txt -e ".[dev]"
    - python -m pytest -q --cov=pyage --cov-report=term-missing --cov-report=xml --cov-fail-under=60
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

tracerlpm-validation:
  stage: test
  script:
    - python -m pip install -c install/constraints.txt -e ".[dev]"
    - python -m pytest -q validation/tracerlpm/benchmark/tests

dotnet-build:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  before_script: []
  script:
    - dotnet build validation/tracerlpm/src/TracerLpmRunner/TracerLpmRunner.csproj -c Release -p:Platform=x64 -p:EnableWindowsTargeting=true

documentation:
  stage: documentation
  script:
    - python -m pip install -c install/constraints.txt -e ".[docs]"
    - python -m sphinx -W --keep-going -b html docs docs/_build/html
  artifacts:
    paths:
      - docs/_build/html

package:
  stage: package
  script:
    - python -m pip install -c install/constraints.txt -e ".[dev]"
    - python -m build
    - python -m twine check dist/*
    - python -m venv .venv-smoke
    - . .venv-smoke/bin/activate
    - python -m pip install dist/*.whl
    - SMOKE_DIR="$(mktemp -d)"
    - cd "$SMOKE_DIR"
    - python -c "import pyage; print(pyage.__version__)"
    - pyage --version
    - pyage list lpms
    - pyage list tracers
    - PYAGE_RESULTS_DIR="$CI_PROJECT_DIR/.smoke-results" pyage check
    - PYAGE_RESULTS_DIR="$CI_PROJECT_DIR/.smoke-results" pyage run "$CI_PROJECT_DIR/examples/templates/quickstart_single.yaml"
    - test -f "$CI_PROJECT_DIR/.smoke-results/test_cases/ploemeur_F09_2010.txt/result_manifest.json"
  artifacts:
    paths:
      - dist/
