stages:
  - quality
  - test
  - documentation
  - package

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip

ruff:
  stage: quality
  script:
    - python -m pip install -e ".[dev]"
    - python -m ruff check .

tests:
  stage: test
  image: "python:${PYTHON_VERSION}-slim"
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12", "3.13"]
  script:
    - python -m pip install -e ".[dev]"
    - python -m pytest -q

extensive-tests:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
      allow_failure: true
  script:
    - python -m pip install -e ".[dev]"
    - python -m pytest -q --run-extensive

documentation:
  stage: documentation
  script:
    - python -m pip install -e ".[docs]"
    - python -m sphinx -W --keep-going -b html docs docs/_build/html
  artifacts:
    paths:
      - docs/_build/html

package:
  stage: package
  script:
    - python -m pip install -e ".[dev]"
    - python -m build
    - python -m twine check dist/*
    - python -m venv .venv-smoke
    - . .venv-smoke/bin/activate
    - python -m pip install dist/*.whl
    - cd "$(mktemp -d)"
    - python -c "import pyage; print(pyage.__version__)"
    - pyage --version
    - pyage list lpms
    - pyage list tracers
    - PYAGE_RESULTS_DIR="$CI_PROJECT_DIR/.smoke-results" pyage check
  artifacts:
    paths:
      - dist/
