# LPM parameters for model "dirac_double_1_set"
# Canonical schema for bounds, initialization, proposal steps, and priors.

model: dirac_double_1_set
version: 1

parameters:
  - name: mufree
    label: free_atom_age
    unit: year
    description: "Age of the free Dirac point mass."
    bounds: [0.0, 70.0]
    init: 10.0
    step: 2.0
    prior:
      type: uniform
      min: 0.0
      max: 70.0
      unit: year

  - name: rate
    label: mix_rate
    unit: "-"
    description: "Probability mass assigned to the free Dirac atom."
    bounds: [0.0, 1.0]
    init: 0.3
    step: 0.1
    prior:
      type: uniform
      min: 0.0
      max: 1.0
      unit: "-"
notes: "Canonical default parameters."
