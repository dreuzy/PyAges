# LPM parameters for model "gamma"
# Canonical schema for validity, calibration, initialization, and priors.

model: gamma
version: 1

parameters:
  - name: k
    label: shape_k
    unit: dimensionless
    description: "Dimensionless gamma shape parameter."
    domain: {min: 0.0, min_inclusive: false, max: null}
    calibration_range: [0.1, 10.0]
    init: 2.0
    step: 0.5
    prior:
      type: uniform
      min: 0.0
      max: 10.0
      unit: dimensionless
  - name: scale
    label: scale
    unit: year
    description: "Gamma scale parameter in years."
    domain: {min: 0.0, min_inclusive: false, max: null}
    calibration_range: [0.1, 80.0]
    init: 10.0
    step: 1.0
    prior:
      type: uniform
      min: 0.0
      max: 100.0
      unit: year

notes: "Canonical default parameters."
