# LPM parameters for model "shapefree_n_oldbin"
#
# The distribution is piecewise uniform on a configurable set of age bins.
# The last interval is an "old" bin, but it remains finite so the model can
# use the standard classic convolution workflow without tracer-specific
# end-members.

model: shapefree_n_oldbin
version: 1

shapefree:
  mode: bounded
  edges: [0.0, 20.0, 40.0, 60.0, 200.0]
  labels: ["0-20", "20-40", "40-60", "old"]
  parameterization: stick_breaking

parameters:
  - name: z1
    label: latent_fraction_1
    unit: "-"
    description: "Stick-breaking latent controlling the first age-bin fraction."
    domain: {min: null, max: null}
    calibration_range: [-8.0, 8.0]
    init: 0.0
    step: 0.5
    prior:
      type: uniform
      min: -8.0
      max: 8.0
      unit: "-"

  - name: z2
    label: latent_fraction_2
    unit: "-"
    description: "Stick-breaking latent controlling the second age-bin fraction."
    domain: {min: null, max: null}
    calibration_range: [-8.0, 8.0]
    init: 0.0
    step: 0.5
    prior:
      type: uniform
      min: -8.0
      max: 8.0
      unit: "-"

  - name: z3
    label: latent_fraction_3
    unit: "-"
    description: "Stick-breaking latent controlling the third age-bin fraction."
    domain: {min: null, max: null}
    calibration_range: [-8.0, 8.0]
    init: 0.0
    step: 0.5
    prior:
      type: uniform
      min: -8.0
      max: 8.0
      unit: "-"

notes: "Default bounded shape-free model with four bins, including a finite-width old bin."
