# LPM parameters for model "dirac"
# Canonical schema for validity, calibration, initialization, and priors.

model: dirac
version: 1

parameters:
  - name: mu
    label: mean_age
    unit: year
    description: "Mean of the distribution."
    domain: {min: 0.0, max: null}
    calibration_range: [0.0, 100.0]
    init: 10.0
    step: 1.0
    prior:
      type: uniform
      min: 0.0
      max: 100.0
      unit: year

notes: "Canonical default parameters."
