# LPM parameters for model "mix_exp_shifted"
# Canonical schema for bounds, initialization, proposal steps, and priors.

model: mix_exp_shifted
version: 1

parameters:
  - name: rate
    label: mix_rate
    unit: "-"
    description: "Probability mass assigned to the exact Dirac component."
    bounds: [0.0, 1.0]
    init: 0.5
    step: 0.1
    prior:
      type: uniform
      min: 0.0
      max: 1.0
      unit: "-"

  - name: mu1
    label: dirac_age
    unit: year
    description: "Age of the exact Dirac point mass."
    bounds: [0.1, 50.0]
    init: 10.0
    step: 0.5
    prior:
      type: uniform
      min: 0.0
      max: 50.0
      unit: year

  - name: mu2
    label: exponential_scale
    unit: year
    description: "Mean and scale of the exponential component."
    bounds: [0.1, 50.0]
    init: 10.0
    step: 0.5
    prior:
      type: uniform
      min: 0.0
      max: 50.0
      unit: year

  - name: shift
    label: exponential_delay
    unit: year
    description: "Delay from mu1 to the lower support of the exponential component."
    bounds: [0.1, 50.0]
    init: 10.0
    step: 0.5
    prior:
      type: uniform
      min: 0.0
      max: 100.0
      unit: year

notes: "Canonical default parameters."
