# LPM parameters for model "exp_shifted"
# Canonical schema for bounds, initialization, proposal steps, and priors.

model: exp_shifted
version: 1

parameters:
  - name: mu
    label: mean_age
    unit: year
    description: "Mean of the distribution."
    bounds: [0.1, 70.0]
    init: 10.0
    step: 1.5
    prior:
      type: normal
      mean: 25.0
      std: 5.0
      unit: year

  - name: shift
    label: time_shift
    unit: year
    description: "Temporal shift applied to the distribution."
    bounds: [0.0, 70.0]
    init: 10.0
    step: 1.5
    prior:
      type: normal
      mean: 10.0
      std: 2.0
      unit: year

notes: "Canonical default parameters."
