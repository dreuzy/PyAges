# LPM parameters for model "exp_shifted"
# Canonical schema for validity, calibration, initialization, and priors.

model: exp_shifted
version: 1

parameters:
  - name: mu
    label: exponential_mean
    unit: year
    description: "Mean and scale of the exponential component, excluding shift."
    domain: {min: 0.0, min_inclusive: false, max: null}
    calibration_range: [0.1, 70.0]
    init: 10.0
    step: 1.5
    prior:
      type: normal
      mean: 25.0
      std: 5.0
      unit: year

  - name: shift
    label: time_shift
    unit: year
    description: "Lower support bound added to the exponential component."
    domain: {min: 0.0, max: null}
    calibration_range: [0.0, 70.0]
    init: 10.0
    step: 1.5
    prior:
      type: normal
      mean: 10.0
      std: 2.0
      unit: year

notes: "Canonical default parameters."
