# LPM parameters for model "uniform"
# Canonical schema for validity, calibration, initialization, and priors.

model: uniform
version: 1

parameters:
  - name: tmin
    label: min_time
    unit: year
    description: "Minimum time parameter."
    domain: {min: 0.0, max: null}
    calibration_range: [0.0, 100.0]
    init: 15.0
    step: 1.0
    prior:
      type: uniform
      min: 0.0
      max: 100.0
      unit: year

  - name: delta
    label: width
    unit: year
    description: "Width parameter."
    domain: {min: 0.0, min_inclusive: false, max: null}
    calibration_range: [0.5, 100.0]
    init: 20.0
    step: 1.0
    prior:
      type: uniform
      min: 0.0
      max: 100.0
      unit: year

notes: "Canonical default parameters."
