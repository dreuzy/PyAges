# LPM parameters for model "exp"
# Canonical schema for validity, calibration, initialization, and priors.

model: exp
version: 1

parameters:
  - name: mu
    label: mean_age
    unit: year
    description: "Mean of the distribution."
    domain: {min: 0.0, min_inclusive: false, max: null}
    calibration_range: [0.1, 100.0]
    init: 10.0
    step: 0.2
    prior:
      type: uniform
      min: 0.1
      max: 100.0
      unit: year

notes: "Canonical default parameters."
