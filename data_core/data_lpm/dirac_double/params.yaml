# LPM parameters for model "dirac_double"
# Canonical schema for bounds, initialization, proposal steps, and priors.

model: dirac_double
version: 1

parameters:
  - name: mu1
    label: first_atom_age
    unit: year
    description: "Age of the first Dirac point mass."
    bounds: [0.0, 70.0]
    init: 10.0
    step: 2.0
    prior:
      type: uniform
      min: 0.0
      max: 100.0
      unit: year

  - name: mu2
    label: second_atom_delay
    unit: year
    description: "Additional delay from mu1 to the second Dirac point mass."
    bounds: [0.0, 70.0]
    init: 70.0
    step: 2.0
    prior:
      type: uniform
      min: 0.0
      max: 100.0
      unit: year

  - name: rate
    label: mix_rate
    unit: "-"
    description: "Probability mass assigned to the first Dirac atom."
    bounds: [0.0, 1.0]
    init: 0.3
    step: 0.1
    prior:
      type: uniform
      min: 0.0
      max: 1.0
      unit: "-"
notes: "Canonical default parameters."
