# LPM parameters for model "ig_shifted"
# Canonical schema for validity, calibration, initialization, and priors.

model: ig_shifted
version: 1

parameters:
  - name: mu
    label: mean_age
    unit: year
    description: "Mean of the distribution."
    domain: {min: 0.0, min_inclusive: false, max: null}
    calibration_range: [0.1, 100.0]
    init: 10.0
    step: 1.0
    prior:
      type: uniform
      min: 0.0
      max: 100.0
      unit: year

  - name: sigma
    label: std_age
    unit: year
    description: "Standard deviation (spread) parameter."
    domain: {min: 0.0, min_inclusive: false, max: null}
    calibration_range: [0.1, 30.0]
    init: 2.0
    step: 0.5
    prior:
      type: uniform
      min: 0.0
      max: 30.0
      unit: year

  - name: shift
    label: time_shift
    unit: year
    description: "Temporal shift applied to the distribution."
    domain: {min: 0.0, max: null}
    calibration_range: [0.1, 50.0]
    init: 4.0
    step: 0.5
    prior:
      type: uniform
      min: 0.0
      max: 30.0
      unit: year

notes: "Canonical default parameters."
