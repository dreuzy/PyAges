# LPM parameters for model "weibull"
# Canonical schema for bounds, initialization, proposal steps, and priors.

model: weibull
version: 1

parameters:
  - name: k
    label: shape
    unit: dimensionless
    description: "Weibull shape parameter (dimensionless)."
    bounds: [0.1, 10.0]
    init: 2.0
    step: 0.2
    prior:
      type: uniform
      min: 0.1
      max: 10.0
      unit: dimensionless

  - name: lambda
    label: scale
    unit: year
    description: "Weibull scale parameter (years)."
    bounds: [0.1, 100.0]
    init: 10.0
    step: 1.0
    prior:
      type: uniform
      min: 0.1
      max: 100.0
      unit: year

notes: "Weibull defaults; adjust bounds/steps to your application."
