# LPM parameters for model "weibull"
# This YAML mirrors the legacy files:
# - bounds.txt (parameter bounds used by LPM_root.__load_bounds)
# - simplex_init.txt (initial values used by calibration_simplex)
# - MHstep.txt (proposal step sizes used by calibration_Metropolis_Hastings)
# - MHapriori.txt (prior distributions used by calibration_Metropolis_Hastings)

model: weibull
version: 1

parameters:
  - name: k
    label: shape
    unit: dimensionless
    description: "Weibull shape parameter (dimensionless)."
    bounds: [0.1, 10.0]
    init: 2.0
    step: 0.2
    prior:
      type: uniform
      min: 0.1
      max: 10.0
      unit: dimensionless

  - name: lambda
    label: scale
    unit: year
    description: "Weibull scale parameter (years)."
    bounds: [0.1, 100.0]
    init: 10.0
    step: 1.0
    prior:
      type: uniform
      min: 0.1
      max: 100.0
      unit: year

notes: "Weibull defaults; adjust bounds/steps to your application."
