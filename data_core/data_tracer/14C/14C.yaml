# 14C (Carbon-14) Tracer Configuration
#
# This file configures the 14C tracer for groundwater age dating.
# 14C is a radioactive isotope used for dating old groundwater.
#
# Author: Jean-Raynald de Dreuzy
# Date: 2026-01-18 (YAML conversion)

# =============================================================================
# Tracer Properties
# =============================================================================

# Unit of concentration measurement
# pmC = percent modern carbon
unit: pmC

# =============================================================================
# Recharge Configuration
# =============================================================================

# Constant recharge concentration (no temporal variation)
# For 14C, atmospheric concentration is considered constant at 100 pmC
recharge_constant: 100

# Enable recharge chronicle from external file
# recharge: false

# =============================================================================
# Radioactive Decay
# =============================================================================

# Published radioactive half-life in years. The loader converts it once to
# the decay rate ln(2) / half_life.
half_life: 5730

# =============================================================================
# Optional: Geoproduction
# =============================================================================

# In-situ production rate (concentration units per year)
# Uncomment to enable geoproduction
# production_rate: 0.0

# =============================================================================
# Valid Date Range
# =============================================================================

# These parameters define the valid computation range for this tracer
# For 14C, these are explicitly defined (not from recharge chronicle)
# Note: datemin is negative (1000 BC)
datemin: -1000
datemax: 2021
