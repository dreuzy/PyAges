# 39Ar (Argon-39) Tracer Configuration
#
# This file configures the 39Ar tracer for groundwater age dating.
# 39Ar is a radioactive noble gas tracer with constant recharge.
#
# Author: Jean-Raynald de Dreuzy
# Date: 2026-01-18 (YAML conversion)

# =============================================================================
# Tracer Properties
# =============================================================================

# Unit of concentration measurement
# Options: pptv (parts per trillion by volume), TU (Tritium Units), pmC (percent modern carbon), fraction_modern
unit: "fraction_modern"

# =============================================================================
# Recharge Configuration
# =============================================================================

# Constant recharge concentration (no temporal variation)
# For 39Ar, atmospheric concentration is considered constant at 100% modern
recharge_constant: 1

# Enable recharge chronicle from external file
# recharge: false

# =============================================================================
# Radioactive Decay
# =============================================================================

# Published radioactive half-life in years.
half_life: 267

# =============================================================================
# Optional: Geoproduction
# =============================================================================

# In-situ production rate (concentration units per year)
# Uncomment to enable geoproduction
# production_rate: 0.0

# =============================================================================
# Valid Date Range
# =============================================================================

# These parameters define the valid computation range for this tracer
# For 39Ar, these are explicitly defined (not from recharge chronicle)
datemin: 200
datemax: 2021

holten:
  reference: "Visser et al. (2013)"
  notes: "Holten uses 39Ar as fraction of modern with a fixed old end-member."
  source:
    observation_table: "examples/natural/holten/doc/sampling_data.txt"
    observation_field: "Ar39_pMC"
    observation_unit: "pMC"
  preparation:
    input_normalization: "pMC_to_fraction_modern_divide_by_100"
    output_unit: "fraction_modern"
    value_scale: "fraction_of_modern"
  old_endmember:
    value: 0.45
    unit: "fraction_modern"
    meaning: "old fraction end-member; 0.45 = 45% modern"
