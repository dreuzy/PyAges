# 14C_SH (Carbon-14, Southern Hemisphere) Tracer Configuration
#
# This file configures the Southern Hemisphere 14C tracer for groundwater age dating.
# 14C is a radioactive isotope used for dating old groundwater.
#
# Author: Jean-Raynald de Dreuzy
# Date: 2026-01-18 (YAML conversion)

# =============================================================================
# Tracer Properties
# =============================================================================

# Unit of concentration measurement
# pmC = percent modern carbon
unit: pmC

# =============================================================================
# Recharge Configuration
# =============================================================================

# Enable recharge chronicle from external file
# If true, concentrations are loaded from recharge.csv in the same directory
# If false, use recharge_constant instead
recharge: true

# Constant recharge concentration (only used if recharge: false)
# recharge_constant: 100

# =============================================================================
# Radioactive Decay
# =============================================================================

# Published radioactive half-life in years. The loader converts it once to
# the decay rate ln(2) / half_life.
half_life: 5730
