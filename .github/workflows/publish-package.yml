name: Publish package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish
        required: true
        default: "1.0.1"
        type: string
      repository:
        description: Package index destination
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify existing release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release verification tools
        run: python -m pip install -c install/constraints.txt packaging twine

      - name: Verify the tag and package metadata
        run: python -m scripts.maintenance.check_project_metadata --tag "$RELEASE_TAG"

      - name: Download the existing GitHub release distributions
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "pyages-${RELEASE_TAG}-py3-none-any.whl" \
            --pattern "pyages-${RELEASE_TAG}.tar.gz" \
            --dir dist

      - name: Verify distribution metadata and GitHub asset digests
        run: |
          python -m twine check dist/*
          gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[] | [.name, .digest] | @tsv' > release-assets.tsv
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          expected_names = {
              f"pyages-{tag}-py3-none-any.whl",
              f"pyages-{tag}.tar.gz",
          }
          distributions = {path.name: path for path in Path("dist").iterdir()}
          if set(distributions) != expected_names:
              raise SystemExit(
                  f"unexpected distributions: {sorted(distributions)}; "
                  f"expected {sorted(expected_names)}"
              )

          release_digests = {}
          for line in Path("release-assets.tsv").read_text(encoding="utf-8").splitlines():
              name, digest = line.split("\t", maxsplit=1)
              release_digests[name] = digest

          for name, path in distributions.items():
              actual = f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}"
              expected = release_digests.get(name)
              if expected != actual:
                  raise SystemExit(
                      f"digest mismatch for {name}: GitHub={expected!r}, local={actual!r}"
                  )
              print(f"verified {name}: {actual}")
          PY

      - name: Stage the verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: distributions-${{ inputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: inputs.repository == 'testpypi'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyages
    permissions:
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: distributions-${{ inputs.tag }}
          path: dist

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          print-hash: true

  publish-pypi:
    name: Publish to PyPI
    if: inputs.repository == 'pypi'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/pyages
    permissions:
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: distributions-${{ inputs.tag }}
          path: dist

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          print-hash: true
