name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            install/constraints.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c install/constraints.txt -e ".[dev]"
      - run: python scripts/check_licensing.py
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            install/constraints.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c install/constraints.txt -e ".[dev,docs,examples]"
      - run: python -m pip check
      - run: python -m pip_audit --local --skip-editable --progress-spinner off

  conda-environment:
    name: Historical article environment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: pyages-article-reproduction
          environment-file: install/environment.yml
          cache-environment: true
      - name: Install and smoke-test PyAges in the Conda environment
        run: |
          micromamba run -n pyages-article-reproduction python -m pip install --no-deps -e .
          micromamba run -n pyages-article-reproduction python -m pip check
          micromamba run -n pyages-article-reproduction python -c "import pyages; print(pyages.__version__)"
          micromamba run -n pyages-article-reproduction pyages --version
          micromamba run -n pyages-article-reproduction pyages list lpms
          micromamba run -n pyages-article-reproduction pyages list tracers

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            install/constraints.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c install/constraints.txt -e ".[dev]"
      - run: python -m pytest -q

  scipy-lower-bounds:
    name: SciPy lower bound (Python ${{ matrix.python-version }}, SciPy ${{ matrix.scipy-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            scipy-version: "1.14.1"
          - python-version: "3.13"
            scipy-version: "1.14.1"
          - python-version: "3.14"
            scipy-version: "1.16.1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" "scipy==${{ matrix.scipy-version }}"
      - name: Test SciPy-dependent scientific paths
        run: >-
          python -m pytest -q
          tests/lpm/test_inverse_gaussian_analytics.py
          tests/lpm/test_continuous_partial_moments.py
          tests/lpm/test_lpm_models.py
          tests/lpm/test_discrete_lpm_analytics.py
          tests/convolution
          tests/calibration/test_calibration_scientific_contracts.py
          tests/calibration/test_calibration_problem.py
          tests/calibration/test_ploemeur_scipy_ig_prior.py

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            install/constraints.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c install/constraints.txt -e ".[dev]"
      - run: python -m pytest -q --cov=pyages --cov-report=term-missing --cov-report=xml --cov-fail-under=60
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  tracerlpm-validation:
    name: TracerLPM validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            install/constraints.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c install/constraints.txt -e ".[dev]"
      - run: python -m pytest -q validation/tracerlpm/benchmark/tests

  dotnet-build:
    name: .NET build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: >-
          dotnet build
          validation/tracerlpm/src/TracerLpmRunner/TracerLpmRunner.csproj
          -c Release
          -p:Platform=x64
          -p:EnableWindowsTargeting=true

  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            install/constraints.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c install/constraints.txt -e ".[docs]"
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html
          retention-days: 14

  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            install/constraints.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c install/constraints.txt -e ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test the wheel outside the checkout
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/.venv-smoke/bin/python" -c "import pyages; print(pyages.__version__)"
          "$GITHUB_WORKSPACE/.venv-smoke/bin/pyages" --version
          "$GITHUB_WORKSPACE/.venv-smoke/bin/pyages" list lpms
          "$GITHUB_WORKSPACE/.venv-smoke/bin/pyages" list tracers
          PYAGES_RESULTS_DIR="$GITHUB_WORKSPACE/.smoke-results" "$GITHUB_WORKSPACE/.venv-smoke/bin/pyages" check
          PYAGES_RESULTS_DIR="$GITHUB_WORKSPACE/.smoke-results" "$GITHUB_WORKSPACE/.venv-smoke/bin/pyages" run "$GITHUB_WORKSPACE/examples/templates/quickstart_single.yaml"
          test -f "$GITHUB_WORKSPACE/.smoke-results/test_cases/ploemeur_F09_2010.txt/result_manifest.json"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          retention-days: 14
