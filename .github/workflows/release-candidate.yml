name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed Git tag to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            install/constraints.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c install/constraints.txt -e ".[dev]"
      - name: Validate release and dependency metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -m scripts.check_project_metadata --tag "$RELEASE_TAG"
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-distributions-${{ inputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  smoke-test:
    name: Wheel smoke test (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-distributions-${{ inputs.tag }}
          path: dist/
      - run: python -m pip install dist/*.whl
      - run: pyage --version
      - run: pyage check
      - run: pyage list lpms
      - run: pyage list tracers

  release-candidate-gate:
    name: Release candidate gate
    if: always()
    needs:
      - build
      - smoke-test
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failed or cancelled prerequisite jobs
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Confirm successful candidate validation
        run: echo "The candidate artifacts passed every release check."
