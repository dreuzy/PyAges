name: Bug report
description: Report a reproducible problem in PyAge
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest configuration, dataset description, or code sample that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PyAge version or commit
      placeholder: 0.1.0b1 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python version, operating system, installation method
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste relevant logs or tracebacks. Remove confidential data first.
      render: shell

